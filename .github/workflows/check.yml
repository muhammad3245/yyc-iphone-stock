name: stock-check
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stock-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      - name: commit refreshed data
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data.json state.json history.json
          git diff --cached --quiet || git commit -m "stock check $(date -u +%FT%TZ)"
          git pull --rebase -X theirs origin master 2>/dev/null || { git rebase --abort 2>/dev/null || true; git fetch origin master; git reset --hard origin/master; }
          git push || { git pull --rebase -X theirs origin master && git push; }
